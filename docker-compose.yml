services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-startupinvest}
      POSTGRES_USER: ${DB_USER:-startupinvest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-startupinvest} -d ${DB_NAME:-startupinvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-startupinvest}
      DB_USER: ${DB_USER:-startupinvest}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_ROOT: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sandbox-client-id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sandbox-client-secret}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@startupinvest.ao}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - backend_uploads:/data/uploads
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-net

volumes:
  postgres_data:
  backend_uploads:

networks:
  app-net:
    driver: bridge