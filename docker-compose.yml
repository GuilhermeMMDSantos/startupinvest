x-app: &app
  build:
    context: .
    target: app
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-startup_invest}
    DB_USERNAME: root
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - storage:/var/www/html/storage
    - public_assets_compiled:/var/www/html/public
  depends_on:
    - mysql
    - redis
  networks:
    - startupinvest

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets_compiled:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - startupinvest

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --sleep=3

  websockets:
    <<: *app
    command: php artisan websockets:serve
    ports:
      - "6001:6001"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-startup_invest}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - startupinvest

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - startupinvest

volumes:
  mysql-data:
      
  redis-data:
      
  storage:
  
  public_assets_compiled:

networks:
  startupinvest:
    driver: bridge
