server:
  port: 8080

spring:
  application:
    name: startupinvest-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:startupinvest}
    username: ${DB_USER:startupinvest}
    password: ${DB_PASSWORD:startupinvest}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:c3RhcnR1cGludmVzdC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2UtMzItYnl0ZXM=}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  storage:
    root: ${STORAGE_ROOT:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  paypal:
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:sandbox-client-id}
    client-secret: ${PAYPAL_CLIENT_SECRET:sandbox-client-secret}
    currency: ${PAYPAL_CURRENCY:USD}
  admin:
    seed-email: ${ADMIN_EMAIL:admin@startupinvest.ao}
    seed-password: ${ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    ao.startupinvest: INFO
